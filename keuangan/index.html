<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#102b50">
  <title>Portal Keuangan | PORSENI Patebon 2026</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f3f6fa;color:#102b50;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
    header{background:#102b50;color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 14px #102b5026}
    .mark{width:42px;height:42px;border-radius:11px;background:#fff;color:#102b50;display:grid;place-items:center;font-weight:900}
    .brand{font-weight:800;letter-spacing:.4px;font-size:16px}
    .sub{font-size:11px;letter-spacing:1.4px;opacity:.75;margin-top:4px}
    main{width:min(100% - 32px,520px);margin:48px auto;flex:1;display:flex;align-items:center}
    .card{width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:30px 24px;box-shadow:0 12px 36px #102b5010;text-align:center}
    .icon{width:64px;height:64px;border-radius:18px;background:#eaf2fb;color:#174675;display:grid;place-items:center;margin:0 auto 18px;font-size:30px}
    h1{font-size:23px;margin:0 0 10px}
    p{font-size:14px;line-height:1.65;color:#64748b;margin:0 auto 24px;max-width:390px}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:12px;background:#102b50;color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:14px}
    .btn:active{transform:translateY(1px)}
    .note{font-size:11px;color:#8492a6;margin-top:17px}
    footer{text-align:center;color:#94a3b8;font-size:11px;padding:18px}
  </style>
</head>
<body>
  <header>
    <div class="mark">P26</div>
    <div>
      <div class="brand">PORSENI PATEBON</div>
      <div class="sub">PORTAL KEUANGAN INTERNAL</div>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="icon" aria-hidden="true">▣</div>
      <h1>Sistem Keuangan PORSENI 2026</h1>
      <p>Portal khusus pengurus internal untuk mengelola administrasi dan laporan keuangan PORSENI Patebon.</p>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbxdZV_GNWDgFRVshuoPBaZzcJGDsUFdCWdipqx-D0gMHjtDn7BOsZepAViQctC8VyhK9w/exec" rel="noopener">
        MASUK PORTAL KEUANGAN <span aria-hidden="true">→</span>
      </a>
      <div class="note">Akses terbatas untuk pengurus yang memiliki akun.</div>
    </section>
  </main>
  <footer>© 2026 PORSENI Patebon · Portal Internal</footer>
</body>
</html>
