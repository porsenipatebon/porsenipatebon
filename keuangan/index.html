<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#102b50">
  <title>Portal Keuangan | PORSENI Patebon 2026</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#102b50}
    .top{height:58px;background:#102b50;color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;box-shadow:0 2px 12px #102b5022}
    .mark{width:34px;height:34px;border-radius:9px;background:#fff;color:#102b50;display:grid;place-items:center;font-weight:800;font-size:12px}
    .brand{font-weight:800;font-size:14px;letter-spacing:.3px}.sub{font-size:10px;opacity:.72;margin-top:3px;letter-spacing:1px}
    main{height:calc(100% - 58px);position:relative}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#f3f6fa;z-index:-1}
    .fallback a{color:#145ca8;font-weight:700}
    @media(max-width:600px){.top{height:52px;padding:0 12px}.mark{width:30px;height:30px}main{height:calc(100% - 52px)}}
  </style>
</head>
<body>
  <header class="top">
    <div class="mark">P26</div>
    <div><div class="brand">PORSENI PATEBON</div><div class="sub">PORTAL KEUANGAN INTERNAL</div></div>
  </header>
  <main>
    <div class="fallback">Portal tidak termuat? <a href="https://script.google.com/macros/s/AKfycbxdZV_GNWDgFRVshuoPBaZzcJGDsUFdCWdipqx-D0gMHjtDn7BOsZepAViQctC8VyhK9w/exec" target="_blank" rel="noopener">Buka portal langsung</a>.</div>
    <iframe
      src="https://script.google.com/macros/s/AKfycbxdZV_GNWDgFRVshuoPBaZzcJGDsUFdCWdipqx-D0gMHjtDn7BOsZepAViQctC8VyhK9w/exec"
      title="Portal Keuangan PORSENI Patebon 2026"
      loading="eager"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </main>
</body>
</html>
